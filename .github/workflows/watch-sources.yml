name: 数据源守望

on:
  schedule:
    - cron: '23 22 * * 1'      # 每周一 UTC 22:23（北京时间周二早 6:23）
  workflow_dispatch:
    inputs:
      all:
        description: '忽略季节限制，全部检查'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: 抓取并比对数据源
        id: watch
        continue-on-error: true
        run: node scripts/watch-sources.mjs ${{ inputs.all && '--all' || '' }}

      - name: 提交更新后的基线
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/.watch-state.json
          git diff --staged --quiet || git commit -m "chore: 更新数据源守望基线 [skip ci]"
          git push || true

      - name: 有变化就开 Issue
        if: steps.watch.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('watch-report.json', 'utf8'));
            if (!r.changed.length) return;

            const hot = r.changed.filter(c => c.newHits && c.newHits.length);
            let body = `数据源守望发现 **${r.changed.length}** 个页面有变化`;
            if (hot.length) body += `，其中 **${hot.length}** 个出现了改考相关关键词`;
            body += `。\n\n检查时间：${r.checkedAt}（${r.month} 月）\n\n`;
            body += `> 这个任务只做**预警**：它能告诉你页面变了，但不会自动解析成数据——\n`;
            body += `> 各校页面结构差异太大，自动解析必然出错，而本项目的底线是不出错误数据。\n`;
            body += `> 请人工打开链接核对，再更新对应的 \`data/*.json\`。\n\n`;

            if (hot.length) {
              body += `## ⚠ 优先看这些（新出现关键词）\n\n`;
              for (const c of hot) {
                body += `- [ ] **${c.name}** — 新关键词：${c.newHits.join('、')}\n`;
                body += `      ${c.url}\n      用途：${c.why}\n`;
              }
              body += `\n`;
            }
            const rest = r.changed.filter(c => !hot.includes(c));
            if (rest.length) {
              body += `## 其他变化\n\n`;
              for (const c of rest) body += `- [ ] ${c.name} — ${c.url}\n`;
            }
            if (r.errors.length) {
              body += `\n## 抓取失败（教育网常态，连续多周失败再处理）\n\n`;
              for (const e of r.errors) body += `- ${e.name} — ${e.error}\n`;
            }

            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `数据源变化：${r.changed.length} 个页面（${r.checkedAt}）`,
              body, labels: ['source-changed', 'data'],
            });
